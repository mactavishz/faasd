version: 1.0
provider:
  name: openfaas
  gateway: ${FAASD_GATEWAY_URL:-http://127.0.0.1:8080}
functions:
  echo-js-remote:
    lang: node24
    handler: ../echo-js/handler
    image: ghcr.io/mactavishz/faasd-echo-js:latest
    limits:
      cpu: 0.25
      memory: 256Mi
configuration:
  templates:
    - name: node24
      source: https://github.com/mactavishz/faas-templates