version: 1.0
provider:
  name: openfaas
  gateway: ${FAASD_GATEWAY_URL:-http://127.0.0.1:8080}
functions:
  echo-js:
    lang: node24
    handler: ./handler
    image: registry.local:5050/faasd/echo-js:latest
    limits:
      cpu: 0.25
      memory: 256Mi
configuration:
  templates:
    - name: node24
      source: https://github.com/mactavishz/faas-templates